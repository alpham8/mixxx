<svg xmlns="http://www.w3.org/2000/svg" width="200" height="8" viewBox="0 0 200 8">
  <!-- Serato-style beat alignment tick marks between waveforms -->
  <rect width="200" height="8" fill="#0a0a0a"/>
  <!-- Center line -->
  <line x1="0" y1="4" x2="200" y2="4" stroke="#222" stroke-width="1"/>
  <!-- Tick marks every 10px -->
  <line x1="0" y1="1" x2="0" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="10" y1="2" x2="10" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="20" y1="1" x2="20" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="30" y1="2" x2="30" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="1" x2="40" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="50" y1="2" x2="50" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="60" y1="1" x2="60" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="2" x2="70" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="80" y1="1" x2="80" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="90" y1="2" x2="90" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="8" stroke="#444" stroke-width="1.5"/>
  <line x1="110" y1="2" x2="110" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="120" y1="1" x2="120" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="2" x2="130" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="140" y1="1" x2="140" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="150" y1="2" x2="150" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="160" y1="1" x2="160" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="170" y1="2" x2="170" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="180" y1="1" x2="180" y2="7" stroke="#333" stroke-width="1"/>
  <line x1="190" y1="2" x2="190" y2="6" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="200" y1="1" x2="200" y2="7" stroke="#333" stroke-width="1"/>
</svg>
